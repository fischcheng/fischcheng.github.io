# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  identity:
    name: "Yu Cheng"
    organization: ""
    type: person
    tagline: "Sustainability Data Scientist"
    description: "Yu Cheng's personal academic website — data science, climate modeling, and sustainability."
    social:
      twitter: "fischcheng"

  theme:
    mode: dark
    pack: "default"
    colors:
      primary: ""
      secondary: ""
      neutral: ""

  typography:
    pack: "modern"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false

  footer:
    style: minimal
    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} Yu Cheng"
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: true
    suggestions: []
    quick_actions: []

  comments:
    enable: false
    provider: ""

  analytics:
    google:
      measurement_id: ""

  verification:
    google: ""
    bing: ""

  repository:
    enable: false

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    frame_options: allow

  pro:
    hide_attribution: false
    affiliate_code: ""
